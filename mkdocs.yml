site_name: Laravel Cheat Sheet
site_description: Laravel from the beginning, with practical examples from a pharmacy system (PharmaCare)
site_author: Efron Damasco
site_url: https://efron07.github.io/laravel-cheatsheet/
repo_url: https://github.com/efron07/laravel-cheatsheet
repo_name: efron07/laravel-cheatsheet
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - 1. Foundations: 01-foundations.md
  - 2. Routing: 02-routing.md
  - 3. Controllers: 03-controllers.md
  - 4. Middleware: 04-middleware.md
  - 5. Views & Blade: 05-views-blade.md
  - 6. Database: 06-database.md
  - 7. Eloquent ORM: 07-eloquent.md
  - 8. Validation: 08-validation.md
  - 9. Authentication: 09-authentication.md
  - 10. Authorization: 10-authorization.md
  - 11. Service container: 11-service-container.md
  - 12. Events & queues: 12-events-queues.md
  - 13. Caching & storage: 13-caching-storage.md
  - 14. Errors & logging: 14-errors-logging.md
  - 15. Testing: 15-testing.md
  - 16. Frontend: 16-frontend.md
  - 17. Performance & deployment: 17-performance-deployment.md
  - 18. Commands: 18-commands.md
